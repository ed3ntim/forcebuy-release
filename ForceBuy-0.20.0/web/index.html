    <!--
      What a crawler sees before any script: the landing page's title and
      description. Each public page sets its own (and its canonical address)
      through PageMeta once it renders.
    -->
    <title>ForceBuy - CS2 inventory tracker with real purchase prices and profit</title>
    <meta
      name="description"
      content="Track what your CS2 skins are worth, what each one cost and your profit. Reads purchases and sales from the Steam Market, CSFloat and Buff163 automatically. Read-only. Closed test, with a demo open to everyone."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ForceBuy" />
    <meta property="og:title" content="ForceBuy - CS2 inventory tracker with real purchase prices and profit" />
    <meta
      property="og:description"
      content="What your CS2 skins are worth, what each one cost and what you made, with purchases read from the Steam Market, CSFloat and Buff163."
    />
    <meta property="og:image" content="https://forcebuy.net/landing/og.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <!-- Data, not a script: the CSP's script-src does not apply to it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

          {
            "@type": "SoftwareApplication",

    <!--

      React provider takes over from here; without this a dark-mode reader saw the

    <script src="/theme-init.js"></script>
    <!-- The ground in the theme's colour before any stylesheet has arrived. -->
    <style>
